<!doctype html>
<!-- 看板页面(2026-11-06-agent看板 plan C-14;spec D3、D11)。
  单文件:内联 CSS、JS,无框架、无外部资源;只请求 /api/board 与 /api/refresh,令牌取自身地址的 ?t=。
  布局与交互照需求目录的 agent看板-线框-v2.html:左右分栏(左任务右会话),默认选中全局最近活动的任务,
  点左栏行右栏即换;「全部/收起」切换超过 30 天的任务;「刷新」重补录一次。
  一屏高、左右栏各自滚动;项目头可折叠(状态记在本浏览器 localStorage,读写失败照常显示);
  右栏顶部是任务摘要卡(阶段、最近活动、会话数、来源),会话按卡片列出。
  页头版本下拉与过滤(带任务数、记住选择),对应 spec D22–D24。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 空 data 图标:压掉浏览器自己发 /favicon.ico(不算外部资源) -->
<link rel="icon" href="data:,">
<title>agent看板</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 一屏高:头部固定,左栏任务、右栏详情各自滚动(窄屏退回整页滚) */
  body { margin: 0; display: flex; flex-direction: column; font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: #24292f; background: #f6f8fa; }
  header { flex: none; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 16px; background: #fff; border-bottom: 1px solid #d0d7de; }
  header h1 { font-size: 15px; margin: 0; }
  .actions { display: flex; gap: 8px; }
  select { font: inherit; font-size: 13px; padding: 2px 6px; border: 1px solid #8c959f; background: #fff; color: #24292f; border-radius: 6px; }
  button { font: inherit; font-size: 13px; padding: 3px 12px; border: 1px solid #8c959f; background: #fff; color: #24292f; border-radius: 6px; cursor: pointer; }
  button:hover:not(:disabled) { background: #f3f4f6; }
  button:disabled { color: #8c959f; cursor: default; }
  .note { flex: none; border-left: 3px solid #0969da; background: #ddf4ff; padding: 4px 10px; margin: 10px 16px 0; font-size: 13px; }
  .board { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; }
  .split[hidden] { display: none; }
  .left, .right { min-width: 0; min-height: 0; overflow-y: auto; }
  .left { padding-right: 6px; }
  .right { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; }
  @media (max-width: 760px) {
    html, body { height: auto; }
    body { display: block; }
    .split { grid-template-columns: minmax(0, 1fr); }
    .left, .right { overflow: visible; }
  }

  /* 左栏:项目折叠头(吸顶)+ 任务行 */
  .pblock { margin-bottom: 10px; }
  .phead { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 6px 8px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; font-size: 14px; font-weight: 600; }
  .phead:hover:not(:disabled) { background: #f3f4f6; }
  .phead .caret { flex: none; width: 12px; color: #57606a; font-size: 11px; }
  .phead .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { flex: none; font-size: 12px; font-weight: 400; color: #57606a; background: #eaeef2; border-radius: 10px; padding: 0 8px; }
  .pdirs { font-size: 12px; color: #57606a; word-break: break-all; margin: 4px 8px 4px 26px; }
  .tasks { margin-top: 4px; }
  .pblock.folded .tasks, .pblock.folded .pdirs { display: none; }
  .task { padding: 6px 8px; border-radius: 6px; border-left: 3px solid transparent; cursor: pointer; }
  .task + .task { margin-top: 2px; }
  .task:hover { background: #eef1f4; }
  .task.cur { background: #dde7f0; border-left-color: #0969da; }
  .task .t1 { display: flex; gap: 8px; align-items: baseline; }
  .task .t1 b { flex: 1; min-width: 0; font-weight: 600; word-break: break-word; }
  .task.old .t1 b { color: #57606a; }
  .task .when { flex: none; font-size: 12px; color: #57606a; font-variant-numeric: tabular-nums; }
  .task .t2 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; font-size: 12px; color: #57606a; }
  .tag { font-size: 12px; color: #57606a; }

  /* 阶段色块与来源色标(左栏、右栏共用) */
  .stage { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 7px; border-radius: 4px; font-weight: 600; color: #57606a; background: #eaeef2; }
  .stage.s1 { color: #0550ae; background: #ddf4ff; }
  .stage.s2 { color: #8250df; background: #fbefff; }
  .stage.s3 { color: #1a7f37; background: #dafbe1; }
  /* 版本标签(D22):与阶段色块同尺寸;已发灰、未发/计划蓝、没赶上红 */
  .ver { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 7px; border-radius: 4px; font-weight: 600; color: #57606a; background: #eaeef2; white-space: nowrap; }
  .ver.open { color: #0550ae; background: #ddf4ff; }
  .ver.missed { color: #cf222e; background: #ffebe9; }
  .agent { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 7px; border-radius: 4px; font-weight: 600; color: #57606a; background: #eaeef2; white-space: nowrap; }
  .agent.a-claude { color: #bc4c00; background: #fff1e5; }
  .agent.a-deepseek { color: #0550ae; background: #ddf4ff; }
  .agent.a-codebuddy { color: #1a7f37; background: #dafbe1; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #8c959f; }
  .dot.a-claude { background: #fb8f44; }
  .dot.a-deepseek { background: #218bff; }
  .dot.a-codebuddy { background: #2da44e; }

  /* 右栏:任务摘要卡(吸顶)+ 会话卡片 */
  .dhead { position: sticky; top: 0; z-index: 1; background: #fff; border-bottom: 1px solid #d0d7de; padding: 12px 16px; }
  .crumb { font-size: 12px; color: #57606a; }
  .dhead h2 { font-size: 18px; margin: 0; line-height: 1.4; word-break: break-word; }
  .fid { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #57606a; word-break: break-all; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .fact { border: 1px solid #d0d7de; border-radius: 6px; padding: 4px 10px; min-width: 96px; }
  .fact .k { display: block; font-size: 12px; color: #57606a; }
  .fact .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fact .v .stage, .fact .v .agent, .fact .v .ver { font-size: 13px; }
  .fact .v .sub { font-size: 12px; font-weight: 400; color: #57606a; }
  .dbody { padding: 4px 16px 14px; }
  .group { margin: 14px 0 6px; font-weight: 600; color: #24292f; }
  .group .tag { font-weight: 400; margin-left: 6px; }
  .sess { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: flex-start; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
  .sess.maybe { border-style: dashed; }
  .sess .info { flex: 1 1 280px; min-width: 0; word-break: break-word; }
  .sess .s1 { display: flex; gap: 8px; align-items: baseline; }
  .sess .stitle { font-size: 14px; font-weight: 600; }
  .sess .s2 { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 4px; font-size: 12px; color: #57606a; }
  .sess .win { color: #24292f; font-weight: 600; font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 6px; border-radius: 4px; background: #eaeef2; color: #24292f; }
  .chip.replica { background: #fbefff; color: #8250df; }
  .chip.why { background: #dafbe1; color: #1a7f37; }
  .sess.maybe .chip.why { background: #fff8c5; color: #7d4e00; }
  .chip.gone { background: #ffebe9; color: #cf222e; }
  .sess .btns { white-space: nowrap; }
  .sess .btns button { font-size: 12px; padding: 1px 8px; }
  .sess.muted .stitle, .sess.muted .win { color: #8c959f; }
  .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .ok { font-size: 12px; color: #1a7f37; margin-left: 4px; }
  .empty { border: 2px dashed #8c959f; border-radius: 8px; padding: 24px; text-align: center; color: #57606a; margin: 8px 0; }
  .right > .empty { margin: 16px; }
  .fallback { margin-top: 12px; }
  .fallback textarea { width: 100%; font: 12px ui-monospace, Menlo, monospace; }
  .hint { margin: 10px 0 0; }
</style>
</head>
<body>
<header>
  <h1>agent看板</h1>
  <div class="actions">
    <select id="ver-filter" aria-label="按版本过滤"></select>
    <button id="all-toggle" type="button">全部</button>
    <button id="refresh" type="button">刷新</button>
  </div>
</header>
<div class="note" id="refresh-note" hidden>正在补录…</div>
<main class="board" id="board">
  <div class="split" id="split">
    <nav class="left" id="left"></nav>
    <section class="right" id="right" aria-live="polite"></section>
  </div>
  <!-- 空态①(C-14):一个项目都没有时整块替换,不显示分栏 -->
  <div class="empty" id="noprojects" hidden>还没有项目:在项目里跑 cgraphx install</div>
</main>

<script>
'use strict';
// ─── 状态 ───────────────────────────────────────────────────────────────────
// data:GET /api/board 的 BoardData(C-6);sel:当前选中(项目名 + 任务 key,跨刷新保选中);
// showAll:「全部/收起」;refreshing:本次刷新请求进行中(防本页连点)。
var data = null;
var sel = null;
var showAll = false;
var refreshing = false;
// folded:项目名 → 是否折叠(用户点过的才有键;没点过的按 isFolded 的默认)
var folded = {};
var FOLD_KEY = 'cgraphx-board-folded';
try {
  var saved = JSON.parse(localStorage.getItem(FOLD_KEY) || '{}');
  if (saved && typeof saved === 'object') folded = saved;
} catch (e) { folded = {}; }
function saveFolded() {
  try { localStorage.setItem(FOLD_KEY, JSON.stringify(folded)); } catch (e) { /* 存不了只影响下次打开 */ }
}
// 版本过滤(K25):'' 全部版本 / 'v:<版本号>' / 'none'(无版本);记在本浏览器,读写失败照常显示
var VERSION_KEY = 'cgraphx-board-version', versionFilter = '';
try { versionFilter = localStorage.getItem(VERSION_KEY) || ''; } catch (e) { versionFilter = ''; }
function saveVersionFilter() { try { localStorage.setItem(VERSION_KEY, versionFilter); } catch (e) { /* 存不了只影响下次打开 */ } }

var TOKEN = '';
try {
  TOKEN = new URLSearchParams(location.search).get('t') || '';
} catch (e) { TOKEN = ''; }

var $left = document.getElementById('left');
var $right = document.getElementById('right');
var $split = document.getElementById('split');
var $noprojects = document.getElementById('noprojects');
var $note = document.getElementById('refresh-note');
var $verFilter = document.getElementById('ver-filter');
var $allBtn = document.getElementById('all-toggle');
var $refreshBtn = document.getElementById('refresh');

// 未归类行的 key(任务行用 featureId,不会撞上)。
var UNSORTED_KEY = '__unsorted__';

// ─── 小工具 ─────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function pad(n) { return n < 10 ? '0' + n : String(n); }
// 跨年带年份,否则 MM-DD(C-14:时间 MM-DD,跨年格式局部适配)。
function fmtDate(ms) {
  var d = new Date(ms);
  if (isNaN(d.getTime())) return '-';
  var core = pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  return d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '-' + core : core;
}
// 任务最近活动、会话窗口用:MM-DD HH:mm(跨年带年份);非法值显示 -。
function fmtTime(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '-';
  return fmtDate(d.getTime()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}
// 会话活动窗口(K6 的 from/to):同一天只写一次日期,跨天两端都写全。
function fmtWindow(from, to) {
  if (!from && !to) return '-';
  if (!to) return fmtTime(from);
  if (!from) return fmtTime(to);
  var a = new Date(from), b = new Date(to);
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return fmtTime(from);
  var sameDay = a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (!sameDay) return fmtTime(from) + ' ~ ' + fmtTime(to);
  if (a.getHours() === b.getHours() && a.getMinutes() === b.getMinutes()) return fmtTime(from);
  return fmtTime(from) + ' ~ ' + pad(b.getHours()) + ':' + pad(b.getMinutes());
}
// 编号短显:session- 前缀取前 16 字符,否则前 8(K7:复制的是完整编号)。
function shortId(id) {
  return id.indexOf('session-') === 0 ? id.slice(0, 16) : id.slice(0, 8);
}
// 阶段色块:null 显示「未规格」
function stageBadge(stage) {
  var cls = { '已规格': ' s1', '已规划': ' s2', '已验证': ' s3' }[stage] || '';
  return '<span class="stage' + cls + '">' + esc(stage || '未规格') + '</span>';
}
// 来源配色按显示名认,未知来源灰色
function agentCls(name) {
  var n = String(name).toLowerCase();
  if (n.indexOf('claude') >= 0) return ' a-claude';
  if (n.indexOf('deepseek') >= 0) return ' a-deepseek';
  if (n.indexOf('codebuddy') >= 0) return ' a-codebuddy';
  return '';
}
function agentBadge(name) { return '<span class="agent' + agentCls(name) + '">' + esc(name) + '</span>'; }
function findProject(name) {
  if (!data) return null;
  for (var i = 0; i < data.projects.length; i++) {
    if (data.projects[i].name === name) return data.projects[i];
  }
  return null;
}
function findTask(p, key) {
  var i, ns = p.noSession || [];
  for (i = 0; i < p.tasks.length; i++) if (p.tasks[i].featureId === key) return { task: p.tasks[i], noSession: false };
  for (i = 0; i < p.older.length; i++) if (p.older[i].featureId === key) return { task: p.older[i], noSession: false };
  for (i = 0; i < ns.length; i++) if (ns[i].featureId === key) return { task: ns[i], noSession: true };
  return null;
}
// ─── 版本(D22):文案、倒序比较、过滤与下拉选项 ─────────────────────────────
// 版本号逐段按数字比,大的在前(C-5;2.0.10 在 2.0.9 前)
function cmpVersionDesc(a, b) {
  var x = a.split('.'), y = b.split('.');
  for (var i = 0; i < 3; i++) { var d = (+x[i] || 0) - (+y[i] || 0); if (d !== 0) return d > 0 ? -1 : 1; }
  return 0;
}
function versionLabel(v) { return v.merged ? (v.released ? v.version : v.version + ' 未发') : (v.released ? '计划 ' + v.version + ' · 没赶上' : '计划 ' + v.version); }
function versionTag(v) { return '<span class="ver' + (v.merged && v.released ? '' : v.released ? ' missed' : ' open') + '">' + esc(versionLabel(v)) + '</span>'; }
function versionTags(t) { var vs = t.versions || []; return vs.length ? '<span class="vers">' + vs.map(versionTag).join('、') + '</span>' : ''; }
// 过滤值 K25:'' 全部版本 / 'v:<版本号>' / 'none'
function matchesFilter(t, value) {
  if (value === '') return true;
  var vs = t.versions || [];
  if (value === 'none') return vs.length === 0;
  for (var i = 0; i < vs.length; i++) if (vs[i].version === value.slice(2)) return true;
  return false;
}
function byActiveDesc(a, b) {
  var av = a.lastActiveAt || '', bv = b.lastActiveAt || '';
  return av !== bv ? (av > bv ? -1 : 1) : a.featureId < b.featureId ? -1 : a.featureId > b.featureId ? 1 : 0;
}
// 具体版本:有会话的按最近活动倒序,noSession 排后面(数据里已按标题排好);无版本:不列 noSession
function filteredTasks(p) {
  var out = [], i, ns = p.noSession || [];
  for (i = 0; i < p.tasks.length; i++) if (matchesFilter(p.tasks[i], versionFilter)) out.push(p.tasks[i]);
  for (i = 0; i < p.older.length; i++) if (matchesFilter(p.older[i], versionFilter)) out.push(p.older[i]);
  out.sort(byActiveDesc);
  if (versionFilter !== 'none') for (i = 0; i < ns.length; i++) if (matchesFilter(ns[i], versionFilter)) out.push(ns[i]);
  return out;
}
function countTasks(p, value) {
  var n = 0, i, ns = p.noSession || [];
  for (i = 0; i < p.tasks.length; i++) if (matchesFilter(p.tasks[i], value)) n++;
  for (i = 0; i < p.older.length; i++) if (matchesFilter(p.older[i], value)) n++;
  if (value !== 'none') for (i = 0; i < ns.length; i++) if (matchesFilter(ns[i], value)) n++;
  return n;
}
// 下拉(K21、K22):全部版本 → 各版本倒序(带个数)→ 无版本;个数为 0 的版本不列
function rebuildVersionOptions() {
  var stats = {}, projects = data ? data.projects : [], pi;
  for (pi = 0; pi < projects.length; pi++) projects[pi].tasks.concat(projects[pi].older, projects[pi].noSession || []).forEach(function (t) {
    (t.versions || []).forEach(function (v) { var cur = stats[v.version]; stats[v.version] = { released: (cur !== undefined && cur.released) || v.released }; });
  });
  var html = '<option value="">全部版本</option>', versions = Object.keys(stats).sort(cmpVersionDesc);
  for (pi = 0; pi < versions.length; pi++) {
    var count = 0, version = versions[pi];
    for (var j = 0; j < projects.length; j++) count += countTasks(projects[j], 'v:' + version);
    if (count === 0) continue;
    html += '<option value="v:' + esc(version) + '">' + esc(version + (stats[version].released ? '' : ' 未发') + '(' + count + ')') + '</option>';
  }
  var noneCount = 0;
  for (pi = 0; pi < projects.length; pi++) noneCount += countTasks(projects[pi], 'none');
  if (noneCount > 0) html += '<option value="none">无版本(' + noneCount + ')</option>';
  $verFilter.innerHTML = html;
  // 记下的版本已经没有任务 → 回全部版本并写回(K25)
  if (versionFilter !== '' && (versionFilter === 'none' ? noneCount === 0 : stats[versionFilter.slice(2)] === undefined)) { versionFilter = ''; saveVersionFilter(); }
  $verFilter.value = versionFilter;
}

// ─── 选中(默认全局最近活动的任务;项目与任务都已按活动降序排好,仍逐组比对 lastActiveAt)───
function defaultSelection() {
  if (versionFilter !== '') { // 具体版本 / 无版本(K24):过滤结果里第一个显示的项目的第一个任务
    for (var vi = 0; vi < data.projects.length; vi++) {
      var list = filteredTasks(data.projects[vi]);
      if (list.length) return { proj: data.projects[vi].name, kind: 'task', key: list[0].featureId };
    }
    return null;
  }
  var best = null;
  for (var pi = 0; pi < data.projects.length; pi++) {
    var t = data.projects[pi].tasks[0];
    if (!t) continue;
    var ts = t.lastActiveAt || '';
    if (best === null || ts > best.ts) best = { ts: ts, proj: data.projects[pi].name, key: t.featureId };
  }
  if (best !== null) return { proj: best.proj, kind: 'task', key: best.key };
  // 没有任何任务:垫底选第一个有未归类会话的项目
  for (var pj = 0; pj < data.projects.length; pj++) {
    if (data.projects[pj].unsorted.length) return { proj: data.projects[pj].name, kind: 'unsorted', key: UNSORTED_KEY };
  }
  return null;
}
function selectionExists(s) {
  if (s === null || !data) return false;
  var p = findProject(s.proj);
  if (p === null) return false;
  if (versionFilter !== '') {
    if (s.kind === 'unsorted') return false; // 只在当前过滤结果里找;未归类一律无效(具体版本含 noSession)
    var list = filteredTasks(p);
    for (var fi = 0; fi < list.length; fi++) if (list[fi].featureId === s.key) return true;
    return false;
  }
  if (s.kind === 'unsorted') return p.unsorted.length > 0;
  var i;
  for (i = 0; i < p.tasks.length; i++) { if (p.tasks[i].featureId === s.key) return true; }
  // 选中的任务可能刷新后掉进 older(最近活动超过 30 天)——右栏会去 older 找,这里也认
  for (i = 0; i < p.older.length; i++) { if (p.older[i].featureId === s.key) return true; }
  return false;
}
function applyData() {
  rebuildVersionOptions(); // 先定过滤值(K25),再判选中还有效?
  if (!selectionExists(sel)) sel = defaultSelection();
  render();
}

// ─── 左栏:项目分组(名字 + 目录、notice、任务、older 提示、未归类垫底)──────────
function taskRow(p, t, kind) {
  // 选中高亮按 项目 + featureId 认(active 与 older 同一任务只此一处;kind 只管 older 的弱化样式)
  var cur = sel !== null && sel.proj === p.name && sel.kind === 'task' && sel.key === t.featureId;
  var count = '定挂 ' + t.fixedCount;
  if (t.maybeCount > 0) count += ' · 可能 ' + t.maybeCount;
  var dots = t.agents.map(function (a) { return '<span class="dot' + agentCls(a) + '" title="' + esc(a) + '"></span>'; }).join(' ');
  var last = t.lastActiveAt ? fmtTime(t.lastActiveAt) : '-';
  return '<div class="task' + (cur ? ' cur' : '') + (kind === 'older' ? ' old' : '') + '" data-proj="' + esc(p.name) + '" data-kind="task" data-key="' + esc(t.featureId) + '">'
    + '<div class="t1"><b>' + esc(t.title) + '</b><span class="when">' + esc(last) + '</span></div>'
    + '<div class="t2">' + stageBadge(t.stage) + versionTags(t) + '<span>' + esc(count) + '</span>' + dots + '</div></div>';
}
function unsortedRow(p) {
  var cur = sel !== null && sel.proj === p.name && sel.kind === 'unsorted';
  return '<div class="task' + (cur ? ' cur' : '') + '" data-proj="' + esc(p.name) + '" data-kind="unsorted" data-key="' + UNSORTED_KEY + '"><div class="t1"><b>未归类(' + p.unsorted.length + ')</b></div></div>';
}
// 折叠:用户点过按记下的;没点过的,第一个显示的项目的与选中所在项目展开,其余收起
// 序号按过滤后实际显示的项目算(K23:整组不画的项目不占序号)
function isFolded(p, shownIndex) {
  if (Object.prototype.hasOwnProperty.call(folded, p.name)) return folded[p.name] === true;
  return shownIndex !== 0 && !(sel !== null && sel.proj === p.name);
}
function renderLeft() {
  if (data === null) { $left.innerHTML = ''; return; }
  if (data.projects.length === 0) { $left.innerHTML = ''; return; }
  var h = '', shown = 0;
  for (var pi = 0; pi < data.projects.length; pi++) {
    var p = data.projects[pi];
    var list = versionFilter === '' ? null : filteredTasks(p);
    if (list !== null && list.length === 0) continue; // 一个匹配任务都没有的项目整组不画
    var fold = isFolded(p, shown++);
    var pill = (list !== null ? list.length : (showAll ? p.tasks.length + p.older.length : p.tasks.length)) + ' 个任务';
    h += '<div class="pblock' + (fold ? ' folded' : '') + '">';
    h += '<button type="button" class="phead" data-fold="' + esc(p.name) + '" aria-expanded="' + (fold ? 'false' : 'true') + '">'
      + '<span class="caret">' + (fold ? '▶' : '▼') + '</span><span class="pname" title="' + esc(p.name) + '">' + esc(p.name) + '</span><span class="pill">' + esc(pill) + '</span></button>';
    h += '<div class="pdirs">' + p.dirs.map(esc).join('<br>') + '</div>';
    if (p.notice) h += '<div class="note" style="margin:4px 0 8px">' + esc(p.notice) + '</div>';
    h += '<div class="tasks">';
    if (list !== null) {
      for (var li = 0; li < list.length; li++) h += taskRow(p, list[li], 'task');
    } else if (p.tasks.length === 0) {
      // 项目无任务:空态文案;older 非空时补一句提示(C-14)
      h += '<div class="empty">还没有挂上会话的任务'
        + (p.older.length ? '<br>还有 ' + p.older.length + ' 个超过 30 天,点「全部」看' : '')
        + '</div>';
    } else {
      for (var ti = 0; ti < p.tasks.length; ti++) h += taskRow(p, p.tasks[ti], 'task');
      if (showAll) {
        for (var oi = 0; oi < p.older.length; oi++) h += taskRow(p, p.older[oi], 'older');
      } else if (p.older.length) {
        h += '<p class="tag" style="margin:4px 8px">还有 ' + p.older.length + ' 个超过 30 天,点「全部」看</p>';
      }
    }
    if (list === null && p.unsorted.length) h += unsortedRow(p);
    h += '</div></div>';
  }
  $left.innerHTML = h;
}

// ─── 右栏:任务详情(定挂/可能相关两组、未归类无依据栏)──────────────────────
function sessionRow(s, kind) {
  // kind:fixed 定挂 / maybe 可能相关 / unsorted 未归类(无依据栏)
  var dirCls = s.dirLabel.indexOf('副本') === 0 ? ' replica' : '';
  var meta = '<span class="win">' + esc(fmtWindow(s.from, s.to)) + '</span>'
    + '<span class="chip' + dirCls + '">' + esc(s.dirLabel) + '</span>';
  if (kind !== 'unsorted') {
    for (var i = 0; i < s.reasons.length; i++) meta += '<span class="chip why">' + esc(s.reasons[i]) + '</span>';
  }
  if (!s.fileExists) meta += '<span class="chip gone">会话文件已不在</span>';
  meta += '<span class="id">' + esc(shortId(s.id)) + '</span>';
  return '<div class="sess' + (kind === 'maybe' ? ' maybe' : '') + (s.fileExists ? '' : ' muted') + '" data-copy-id="' + esc(s.id) + '" data-copy-title="' + esc(s.title) + '">'
    + '<div class="info"><div class="s1">' + agentBadge(s.agent) + '<span class="stitle">' + esc(s.title) + '</span></div>'
    + '<div class="s2">' + meta + '</div></div>'
    + '<div class="btns"><button type="button" class="copy" data-copy="id">复制编号</button> '
    + '<button type="button" class="copy" data-copy="title">复制标题</button></div></div>';
}
function fact(k, v) { return '<div class="fact"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>'; }
var FALLBACK = '<div class="fallback" id="fallback" hidden>'
  + '<div class="tag">没能写进剪贴板,手动复制</div>'
  + '<textarea rows="2" readonly></textarea></div>';
var COPY_HINT = '<p class="tag hint">点按钮复制完整内容,列表里编号只显示前面一段</p>';
function renderRight() {
  if (data === null) {
    $right.innerHTML = '<div class="empty">看板数据没拿到<br>请从终端打印的带令牌地址打开,或点「刷新」重试</div>';
    return;
  }
  if (data.projects.length === 0) {
    $right.innerHTML = '<div class="empty">还没有项目:在项目里跑 cgraphx install</div>';
    return;
  }
  if (sel === null) {
    $right.innerHTML = '<div class="empty">还没有挂上会话的任务</div>';
    return;
  }
  var p = findProject(sel.proj);
  if (p === null) { $right.innerHTML = ''; return; }
  var h;
  if (sel.kind === 'unsorted') {
    h = '<div class="dhead"><div class="crumb">' + esc(p.name) + '</div><h2>未归类会话</h2>'
      + '<div class="facts">' + fact('会话', String(p.unsorted.length)) + '</div></div><div class="dbody">';
    h += p.unsorted.length
      ? p.unsorted.map(function (s) { return sessionRow(s, 'unsorted'); }).join('')
      : '<div class="empty">没有未归类的会话</div>';
  } else {
    var found = findTask(p, sel.key);
    if (found === null) { $right.innerHTML = ''; return; }
    var t = found.task;
    var sessions = '<span class="sub">定挂</span> ' + t.fixed.length
      + (t.maybe.length ? ' <span class="sub">· 可能相关</span> ' + t.maybe.length : '');
    h = '<div class="dhead"><div class="crumb">' + esc(p.name) + '</div><h2>' + esc(t.title) + '</h2>'
      + '<div class="fid">' + esc(t.featureId) + '</div><div class="facts">'
      + fact('阶段', stageBadge(t.stage))
      + fact('版本', t.versions && t.versions.length ? versionTags(t) : '无版本')
      + fact('最近活动', esc(t.lastActiveAt ? fmtTime(t.lastActiveAt) : '-'))
      + fact('会话', sessions)
      + fact('来源', t.agents.length ? t.agents.map(agentBadge).join(' ') : '-')
      + '</div></div><div class="dbody">';
    if (found.noSession) {
      h += '<div class="empty">本机没有挂上的会话</div>'; // F7 ②:不画「定挂(0)」组
    } else {
      h += '<div class="group">定挂(' + t.fixed.length + ')</div>';
      h += t.fixed.length ? t.fixed.map(function (s) { return sessionRow(s, 'fixed'); }).join('') : '<div class="empty">没有定挂的会话</div>';
      if (t.maybe.length) {
        h += '<div class="group">可能相关(' + t.maybe.length + ')</div>';
        h += t.maybe.map(function (s) { return sessionRow(s, 'maybe'); }).join('');
      }
    }
  }
  h += FALLBACK + COPY_HINT + '</div>';
  $right.innerHTML = h;
}
// 选中变了右栏回到顶部;同一选中(如刷新)保留滚动位置
var renderedSel = '';
function render() {
  var empty = data !== null && data.projects.length === 0;
  $split.hidden = empty;
  $noprojects.hidden = !empty;
  // 选了具体版本 / 无版本时「全部 / 收起」不起作用(F7)
  $allBtn.disabled = versionFilter !== '';
  renderLeft();
  renderRight();
  var key = sel === null ? '' : sel.proj + '\n' + sel.kind + '\n' + sel.key;
  if (key !== renderedSel) { $right.scrollTop = 0; renderedSel = key; }
}

// ─── 交互 ───────────────────────────────────────────────────────────────────
document.addEventListener('click', function (e) {
  var copy = e.target.closest ? e.target.closest('.copy') : null;
  if (copy) { doCopy(copy); return; }
  var head = e.target.closest ? e.target.closest('[data-fold]') : null;
  if (head) {
    var name = head.dataset.fold;
    var block = head.parentElement;
    folded[name] = !(block !== null && block.classList.contains('folded'));
    saveFolded();
    renderLeft();
    return;
  }
  var row = e.target.closest ? e.target.closest('[data-key]') : null;
  if (row && row.dataset.proj !== undefined) {
    sel = { proj: row.dataset.proj, kind: row.dataset.kind === 'unsorted' ? 'unsorted' : 'task', key: row.dataset.key };
    render();
  }
});

// 复制(D11):127.0.0.1 是安全上下文,走 navigator.clipboard;失败降级为已选中的只读文本框。
function doCopy(btn) {
  var sess = btn.closest('.sess');
  if (sess === null) return;
  var text = btn.dataset.copy === 'title' ? sess.dataset.copyTitle : sess.dataset.copyId;
  var write = navigator.clipboard && navigator.clipboard.writeText
    ? navigator.clipboard.writeText(text)
    : Promise.reject(new Error('no clipboard'));
  write.then(function () {
    var btns = btn.parentElement;
    if (btns !== null) {
      var olds = btns.querySelectorAll('.ok');
      for (var i = 0; i < olds.length; i++) olds[i].remove();
    }
    var ok = document.createElement('span');
    ok.className = 'ok';
    ok.textContent = '已复制';
    btn.after(ok);
  }).catch(function () {
    var fb = document.getElementById('fallback');
    if (fb === null) return;
    fb.hidden = false;
    var box = fb.querySelector('textarea');
    box.value = text;
    box.focus();
    box.select();
  });
}

$allBtn.addEventListener('click', function () {
  if (versionFilter !== '') return;
  showAll = !showAll;
  $allBtn.textContent = showAll ? '收起' : '全部';
  renderLeft();
});

// 版本下拉(K23–K25):切过滤值 → 记下 → 重判选中(K24)
$verFilter.addEventListener('change', function () { versionFilter = $verFilter.value; saveVersionFilter(); applyData(); });

function showNote(text) { $note.textContent = text; $note.hidden = false; }
function hideNote() { $note.hidden = true; }

// 刷新(C-14):期间「正在补录…」;完成用返回数据重渲;409 提示正在刷新并保留旧数据。
$refreshBtn.addEventListener('click', function () {
  if (refreshing) return;
  refreshing = true;
  $refreshBtn.disabled = true;
  showNote('正在补录…');
  fetch('/api/refresh?t=' + encodeURIComponent(TOKEN), { method: 'POST' })
    .then(function (res) {
      if (res.status === 409) throw { conflict: true };
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (fresh) {
      data = fresh;
      applyData();
      hideNote();
    })
    .catch(function (err) {
      if (err && err.conflict) showNote('正在刷新,请稍候');
      else showNote('刷新没成功,稍后再试');
    })
    .then(function () {
      refreshing = false;
      $refreshBtn.disabled = false;
    });
});

// ─── 首屏 ───────────────────────────────────────────────────────────────────
fetch('/api/board?t=' + encodeURIComponent(TOKEN), { cache: 'no-store' })
  .then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  })
  .then(function (fresh) {
    data = fresh;
    applyData();
    var cur = $left.querySelector('.task.cur');
    if (cur !== null && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
  })
  .catch(function () {
    renderRight(); // data 为 null:右栏给出人能看懂的错误与出路
  });
</script>
</body>
